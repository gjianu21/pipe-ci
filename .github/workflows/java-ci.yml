name: Java CI (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '25'
      working-directory:
        required: false
        type: string
        default: '.'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Make mvnw executable
        run: chmod +x ${{ inputs.working-directory }}/mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Spotless check
        run: ./mvnw spotless:check

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Make mvnw executable
        run: chmod +x ${{ inputs.working-directory }}/mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Run tests with coverage
        run: ./mvnw test org.jacoco:jacoco-maven-plugin:report org.jacoco:jacoco-maven-plugin:check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ inputs.working-directory }}/target/site/jacoco

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Make mvnw executable
        run: chmod +x ${{ inputs.working-directory }}/mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Build jar (simulare build)
        run: ./mvnw package -DskipTests
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ inputs.working-directory }}/target/*.jar