name: Deploy to Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      service-name:
        required: true
        type: string
      gcp-project-id:
        required: true
        type: string
      gcp-region:
        required: true
        type: string
      artifact-repo:
        required: true
        type: string
      workload-identity-provider:
        required: true
        type: string
      service-account:
        required: true
        type: string
      db-username:
        required: false
        type: string
        default: ''
      build-args:
        required: false
        type: string
        default: ''
      min-instances:
        required: false
        type: string
        default: '0'
      max-instances:
        required: false
        type: string
        default: '1'
    secrets:
      DB_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.artifact-repo }}/${{ inputs.service-name }}:${{ github.sha }}"
          BUILD_ARGS=""
          while IFS= read -r line; do
            [ -n "$line" ] && BUILD_ARGS="$BUILD_ARGS --build-arg $line"
          done <<< "${{ inputs.build-args }}"
          docker build $BUILD_ARGS -t "$IMAGE" ${{ inputs.working-directory }}
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service-name }}
          region: ${{ inputs.gcp-region }}
          image: ${{ env.IMAGE }}
          project_id: ${{ inputs.gcp-project-id }}
          env_vars: |
            flags: --min-instances=${{ inputs.min-instances }} --max-instances=${{ inputs.max-instances }}
            SPRING_PROFILES_ACTIVE=prod
            DB_USERNAME=${{ inputs.db-username }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            OAUTH2_BFF_CLIENT_SECRET=${{ secrets.OAUTH2_BFF_CLIENT_SECRET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}

      - name: Allow public (unauthenticated) access
        run: |
          gcloud run services add-iam-policy-binding ${{ inputs.service-name }} \
            --region=${{ inputs.gcp-region }} \
            --project=${{ inputs.gcp-project-id }} \
            --member="allUsers" \
            --role="roles/run.invoker"