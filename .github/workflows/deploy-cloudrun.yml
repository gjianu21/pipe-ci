name: Deploy to Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      service-name:
        required: true
        type: string
      gcp-project-id:
        required: true
        type: string
      gcp-region:
        required: true
        type: string
      artifact-repo:
        required: true
        type: string
      workload-identity-provider:
        required: true
        type: string
      service-account:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.artifact-repo }}/${{ inputs.service-name }}:${{ github.sha }}"
          docker build -t "$IMAGE" ${{ inputs.working-directory }}
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service-name }}
          region: ${{ inputs.gcp-region }}
          image: ${{ env.IMAGE }}
          project_id: ${{ inputs.gcp-project-id }}